name = "sentinelsql-gateway"
account_id = "d3691c8edea502ade020588b5292be0c"
main = "gateway.mjs"
compatibility_date = "2026-10-07"
workers_dev = false
preview_urls = false
# Set a public Cloudflare zone route during provisioning; .internal is private.
# routes = [{ pattern = "api.YOUR_PUBLIC_ZONE/*", zone_name = "YOUR_PUBLIC_ZONE" }]
[vars]
ORIGIN_URL = "https://origin.REPLACE_WITH_PUBLIC_ZONE"
ALLOWED_ORIGINS = "https://sentinelsql-portal.pages.dev"
SESSION_TTL = "900"
# SESSION_KEY_B64, ACCESS_CLIENT_ID and ACCESS_CLIENT_SECRET are Worker secrets.
[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
