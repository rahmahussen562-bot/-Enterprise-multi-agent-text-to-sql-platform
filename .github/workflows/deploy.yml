name: SentinelSQL production
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sentinelsql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHON_VERSION: "3.14.7"
  NODE_VERSION: "24"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONNOUSERSITE: "1"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy_bundle
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/deploy_bundle/.runtime/pip-cache
      TMPDIR: ${{ github.workspace }}/deploy_bundle/.runtime/tmp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Prepare test cache directories
        run: mkdir -p .runtime/tmp .runtime/pip-cache
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Provision isolated test environment
        run: |
          mkdir -p .runtime/tmp
          sudo apt-get update
          sudo apt-get install -y libodbc2
          python -m venv .venv
          .venv/bin/python -m pip install --only-binary=:all: -r requirements-phase04.lock.txt -r requirements-deployment.txt
          .venv/bin/python -m pip check
      - name: Run full baseline plus deployment tests against native PostgreSQL
        run: .venv/bin/python tools/run_ci_backend.py
      - name: Lint production and deployment changes
        run: .venv/bin/python -m ruff check --select E9,F63,F7,F82 api core agents tools/deploy_backend.py tools/run_ci_backend.py tools/smoke_container.py tools/verify_edge.py
      - name: Verify deployment manifest contracts
        run: .venv/bin/python tools/verify_phase56_manifests.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: backend-test-evidence
          path: deploy_bundle/docs/PHASE56_TEST_RESULTS.xml
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      npm_config_cache: ${{ github.workspace }}/frontend/.runtime/npm-cache
      npm_config_prefix: ${{ github.workspace }}/frontend/.runtime/npm-global
      npm_config_logs_dir: ${{ github.workspace }}/frontend/.runtime/npm-cache/_logs
      TMPDIR: ${{ github.workspace }}/frontend/.runtime/tmp
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.sentinelsql.internal/api/v1' }}
      VITE_WS_BASE_URL: ${{ vars.VITE_WS_BASE_URL || 'wss://api.sentinelsql.internal/api/v1' }}
      SENTINEL_PRODUCTION_BUILD: "1"
      VITE_ENABLE_VOICE_INPUT: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Prepare frontend cache directories
        run: mkdir -p .runtime/tmp .runtime/npm-cache .runtime/npm-global
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install and audit locked dependencies
        run: |
          mkdir -p .runtime/tmp
          npm ci --no-fund
          npm audit --audit-level=low
      - name: API drift, zero emoji, routing and frontend tests
        run: |
          npm run check:api
          node tools/verify-source.mjs
          npm test
          node --test tools/pages-security.test.mjs ../deploy_bundle/edge/gateway.test.mjs
      - name: Build Pages assets
        run: npm run build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pages-dist
          path: frontend/dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: frontend-test-evidence
          path: frontend/.runtime/frontend-tests.xml
  container-tests:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy_bundle
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy_bundle
          load: true
          tags: sentinelsql-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image with the TLS Compose stack
        env:
          PIP_CACHE_DIR: ${{ github.workspace }}/deploy_bundle/.runtime/pip-cache
          TMPDIR: ${{ github.workspace }}/deploy_bundle/.runtime/tmp
        run: |
          mkdir -p .runtime/tmp
          python -m venv .venv
          .venv/bin/python -m pip install --only-binary=:all: -r requirements-production.txt -r requirements-deployment.txt
          .venv/bin/python tools/smoke_container.py
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [container-tests]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sentinelsql-api" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: deploy_bundle
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
  backend-deploy:
    needs: [release]
    runs-on: [self-hosted, sentinelsql-production]
    environment: production
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: deploy_bundle
        shell: bash
    env:
      FASTAPI_IMAGE: ${{ needs.release.outputs.image }}
      TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
      SENTINEL_DEPLOY_DIR: ${{ vars.SENTINEL_DEPLOY_DIR }}
      SENTINEL_SECRETS_DIR: ${{ vars.SENTINEL_SECRETS_DIR }}
      API_ORIGIN: ${{ vars.API_ORIGIN || 'https://api.sentinelsql.internal' }}
      SENTINEL_EDGE_CA_FILE: ${{ vars.SENTINEL_EDGE_CA_FILE }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          clean: false
          persist-credentials: false
      - name: Prepare ephemeral registry credential directory
        run: |
          mkdir -p "$RUNNER_TEMP/sentinelsql-docker-auth"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/sentinelsql-docker-auth" >> "$GITHUB_ENV"
      - name: Authenticate container registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Release backend and verify live edge
        run: |
          python tools/deploy_backend.py
          python tools/verify_edge.py
      - name: Remove ephemeral registry credential
        if: always()
        run: docker logout ghcr.io
  pages-deploy:
    needs: [backend-deploy]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    env:
      npm_config_cache: ${{ github.workspace }}/frontend/.runtime/npm-cache
      npm_config_prefix: ${{ github.workspace }}/frontend/.runtime/npm-global
      npm_config_logs_dir: ${{ github.workspace }}/frontend/.runtime/npm-cache/_logs
      XDG_CONFIG_HOME: ${{ github.workspace }}/frontend/.runtime/config
      WRANGLER_LOG_PATH: ${{ github.workspace }}/frontend/.runtime/wrangler.log
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: pages-dist
          path: frontend/dist
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.3"
          workingDirectory: frontend
          command: pages deploy dist --project-name=sentinelsql-portal --branch=main
